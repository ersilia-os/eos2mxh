Title: Chemical Checker Signaturizer 3D B1-5
Description: Describes a compound through the target level of the Chemical Checker,
  whose five B spaces record mechanism of action, metabolic genes, crystal-structure
  binding, HTS activity profiles and binding assays. The underlying signaturizers
  were retrained on 3D structures after a survey of over a million compounds showed
  roughly 40% of stereoisomer pairs diverging in bioactivity, letting enantiomers
  receive distinct descriptors. Values are inferred rather than measured, and are
  most reliable for compounds resembling the assayed chemical space.
